apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoneflow-app
  namespace: stoneflow
  labels:
    app: stoneflow
    tier: frontend-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stoneflow
  template:
    metadata:
      labels:
        app: stoneflow
        tier: frontend-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/health"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: stoneflow-container
          image: stoneflow-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-web
          envFrom:
            - configMapRef:
                name: stoneflow-config
            - secretRef:
                name: stoneflow-secrets
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            - name: data-storage
              mountPath: /app/data
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: stoneflow-data-pvc
