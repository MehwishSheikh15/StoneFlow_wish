apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stoneflow-hpa
  namespace: stoneflow
  labels:
    app: stoneflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stoneflow-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
